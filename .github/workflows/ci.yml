name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify actions are pinned to immutable commits
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! awk '
            /^[[:space:]]*(-[[:space:]]+)?uses:/ {
              ref = ($1 == "-") ? $3 : $2
              if (ref !~ /@[0-9a-f]{40}$/) {
                print FILENAME ":" FNR ": " ref
                failed = 1
              }
            }
            END { exit failed }
          ' .github/workflows/*.yml; then
            echo "Every GitHub Action must use a full 40-character commit SHA." >&2
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: reader -> target
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            ~/AppData/Local/bun/cache
          key: bun-${{ runner.os }}-${{ hashFiles('reader/desktop/bun.lockb', 'reader/desktop/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: reader/desktop
        run: bun install --frozen-lockfile

      - name: Run Rust tests (mangaplus-api)
        working-directory: reader
        run: cargo test -p mangaplus-api

      - name: Run Rust tests (mangaplus-desktop)
        working-directory: reader
        run: cargo test -p mangaplus-desktop

      - name: Check Rust formatting (warn only — we don't have a committed rustfmt config yet)
        working-directory: reader
        run: cargo fmt --check || true

      - name: Clippy (mangaplus-api)
        working-directory: reader
        run: cargo clippy -p mangaplus-api --lib --tests -- -D warnings

      - name: Clippy (mangaplus-desktop)
        working-directory: reader
        run: cargo clippy -p mangaplus-desktop --lib --tests -- -D warnings

      - name: Vitest (TS lib unit tests)
        working-directory: reader/desktop
        run: bun run test

      - name: Build frontend (SvelteKit static export)
        working-directory: reader/desktop
        run: bun run build
